version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    target-branch: main
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: main

  - package-ecosystem: docker
    directories:
      - /containers/daemon
      - /containers/operator
    schedule:
      interval: weekly
    target-branch: main
