# Every commit merged into `main` publishes the daemon and operator images
# under its immutable full Git commit SHA. Releases promote those exact image
# manifests to a human-readable version; they never rebuild them.
name: publish-images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io/thunder-compute/thunder-device-plugin

jobs:
  publish:
    name: publish images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require main
        run: |
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || {
            echo "image publishing must run from main, got ${GITHUB_REF}"
            exit 1
          }

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: daemon
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/daemon/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/daemon:${{ github.sha }}

      - id: operator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/operator/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/operator:${{ github.sha }}

      - uses: sigstore/cosign-installer@v3
      - name: Sign the images
        run: |
          cosign sign --yes \
            "${REGISTRY}/daemon@${{ steps.daemon.outputs.digest }}"
          cosign sign --yes \
            "${REGISTRY}/operator@${{ steps.operator.outputs.digest }}"
