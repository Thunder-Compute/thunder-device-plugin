# Every commit on `next` becomes a source release candidate. Component
# images are built independently; values.yaml selects the timestamped images
# this candidate composes and validates.
name: release-candidate

on:
  push:
    branches: [next]
  workflow_dispatch:

concurrency:
  group: release-candidate
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  publish:
    name: publish candidate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Candidates are numbered by distance from main, so the full history and
      # the main ref both have to be present.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        run: echo "version=$(hack/release-version.sh)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the selected component images
        run: make verify-chart-images

      - name: Tag the candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "Release candidate staged on \`next\`."
            echo
            echo "The component image tags are the immutable UTC builds recorded in"
            echo '`charts/thunder-device-plugin/values.yaml`.'
          } > notes.md
          gh release create "v${VERSION}" \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --notes-file notes.md
