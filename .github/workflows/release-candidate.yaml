# Every commit on `next` becomes a release candidate after its chart values
# have been updated by `make publish-images`. This workflow verifies that the
# committed image references exist, then publishes the chart composition as a
# prerelease.
name: release-candidate

on:
  push:
    branches: [next]
  workflow_dispatch:

concurrency:
  group: release-candidate
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  HELM_VERSION: v4.0.1
  CHART_REGISTRY: oci://ghcr.io/thunder-compute/charts

jobs:
  publish:
    name: publish candidate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        run: echo "version=$(hack/release-version.sh)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify selected component images
        run: make verify-chart-images

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Publish the chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          helm registry login ghcr.io \
            --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}"
          make helm-push

      - name: Tag the candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "Release candidate staged from the chart composition on \`next\`."
            echo
            echo "The component image tags are recorded in values.yaml and were verified before packaging."
          } > notes.md
          gh release create "v${VERSION}" \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --notes-file notes.md
