# A release packages the chart composition already staged on `next`. Images
# are not rebuilt or retagged here: values.yaml already selects the exact
# immutable image artifacts that were tested by the release candidate.
name: release

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: "Candidate to promote, e.g. 0.2.0-rc.3"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  HELM_VERSION: v4.0.1
  CHART_REGISTRY: oci://ghcr.io/thunder-compute/charts

jobs:
  promote:
    name: promote candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - id: version
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] ||
            { echo "releases must run from main, got ${GITHUB_REF}"; exit 1; }
          [[ "${CANDIDATE}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]] ||
            { echo "candidate must look like 0.2.0-rc.3, got ${CANDIDATE}"; exit 1; }

          candidate_sha="$(git rev-list -n1 "v${CANDIDATE}")"
          main_sha="$(git rev-parse HEAD)"
          [[ "${candidate_sha}" == "${main_sha}" ]] || {
            echo "v${CANDIDATE} is ${candidate_sha} but main is ${main_sha}."
            echo "Fast-forward main onto the candidate before releasing."
            exit 1
          }

          version="${CANDIDATE%%-rc.*}"
          expected="$(hack/release-version.sh main)"
          [[ "${version}" == "${expected}" ]] ||
            { echo "candidate says ${version}, Chart.yaml says ${expected}"; exit 1; }

          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify selected component images
        run: make verify-chart-images

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Publish the chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          helm registry login ghcr.io \
            --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}"
          make helm-push

      - name: Tag the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE: ${{ inputs.candidate }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "Promoted from \`v${CANDIDATE}\`."
            echo "The chart values retain the immutable component image tags verified by the candidate."
            echo
            echo '```bash'
            echo "helm install thunder-device-plugin \\"
            echo "  oci://ghcr.io/thunder-compute/charts/thunder-device-plugin --version ${VERSION}"
            echo '```'
            echo
            echo "Changes: https://github.com/${GITHUB_REPOSITORY}/compare/v${CANDIDATE}...v${VERSION}"
          } > notes.md
          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --notes-file notes.md
