# Promotion, not a build. Every commit on `main` has images tagged by its full
# Git SHA. A release promotes the selected `main` commit's image manifests to
# the release version, so what is installed is that exact artifact.
#
# Run this from `main`, after its image publishing workflow has completed.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.2.0"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

env:
  HELM_VERSION: v4.0.1
  REGISTRY: ghcr.io/thunder-compute/thunder-device-plugin
  CHART_REGISTRY: oci://ghcr.io/thunder-compute/charts

jobs:
  promote:
    name: promote main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # Releases must be run from main. The checked-out commit already has
      # images published by publish-images.yaml under its full Git SHA.
      - id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] ||
            { echo "releases must run from main, got ${GITHUB_REF}"; exit 1; }
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]] ||
            { echo "version must look like 0.2.0, got ${VERSION}"; exit 1; }
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the main images
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
        run: |
          set -euo pipefail
          for image in daemon operator; do
            docker buildx imagetools inspect "${REGISTRY}/${image}:${SOURCE_SHA}" >/dev/null
            docker buildx imagetools create \
              --tag "${REGISTRY}/${image}:${VERSION}" \
              "${REGISTRY}/${image}:${SOURCE_SHA}"
          done

      - name: Verify the release is the main commit
        env:
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: make verify-promotion SOURCE_TAG="${SOURCE_SHA}" RELEASE_VERSION="${VERSION}"

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Publish the chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          helm registry login ghcr.io \
            --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}"
          make helm-push

      - name: Tag the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "Promoted from main commit \`${SOURCE_SHA}\`."
            echo "Identical image digests: the release is that main image promoted, not a rebuild."
            echo
            echo '```bash'
            echo "helm install thunder-device-plugin \\"
            echo "  oci://ghcr.io/thunder-compute/charts/thunder-device-plugin --version ${VERSION}"
            echo '```'
            echo
            echo "Commit: https://github.com/${GITHUB_REPOSITORY}/commit/${SOURCE_SHA}"
          } > notes.md
          gh release create "v${VERSION}" \
            --target "${SOURCE_SHA}" \
            --title "v${VERSION}" \
            --notes-file notes.md
