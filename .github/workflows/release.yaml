# A release packages the chart composition already merged through `next` and
# `main`. The chart values explicitly select the CI-published image tags.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.2.0"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  HELM_VERSION: v4.0.1
  CHART_REGISTRY: oci://ghcr.io/thunder-compute/charts

jobs:
  release:
    name: publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] ||
            { echo "releases must run from main, got ${GITHUB_REF}"; exit 1; }
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]] ||
            { echo "version must look like 0.2.0, got ${VERSION}"; exit 1; }
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify chart-selected images
        run: make verify-chart-images

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Publish the chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          helm registry login ghcr.io \
            --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}"
          make helm-push

      - name: Tag the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "Published from main commit \`${SOURCE_SHA}\`."
            echo "The chart values pin the CI-published component image tags verified before packaging."
            echo
            echo '```bash'
            echo "helm install thunder-device-plugin \\"
            echo "  oci://ghcr.io/thunder-compute/charts/thunder-device-plugin --version ${VERSION}"
            echo '```'
            echo
            echo "Commit: https://github.com/${GITHUB_REPOSITORY}/commit/${SOURCE_SHA}"
          } > notes.md
          gh release create "v${VERSION}" \
            --target "${SOURCE_SHA}" \
            --title "v${VERSION}" \
            --notes-file notes.md
