# Staging overlay for thunder-device-plugin.
#
#   helm upgrade --install thunder-device-plugin charts/thunder-device-plugin \
#     --namespace thunder-system --wait -f deploy/staging-values.yaml
#
# Everything here differs from the chart defaults, which target the public
# Docker Hub images and the production Thunder API. Nothing secret lives in
# this file: the API token comes from the thunder-api Secret, and the registry
# credential from the pre-existing gar-secret.

# Staging images live in the private Artifact Registry repo, which allows no
# anonymous pull. gar-secret already exists in thunder-system (and in most
# other namespaces on this cluster); without it both pods sit in
# ImagePullBackOff with a 403 from the AR token endpoint.
imagePullSecrets:
  - name: gar-secret

thunder:
  # Staging control plane rather than registry.thundercompute.com. The scheme
  # is required: values.schema.json enforces ^https?://
  apiURL: "https://giga-staging.thundercompute.com:2096"
  # Matches the collector the node's own thunderd is registered with
  # (credentials.telemetryUrl in /var/lib/thunder/thunderd.state).
  telemetryURL: "https://telemetry-staging.thundercompute.com:2096"
  # Staging serves its own libthunder.so build, pinned by its own install.sh.
  artifactBaseURL: "https://staging-get.thundercompute.com"

operator:
  image:
    repository: ghcr.io/thunder-compute/thunder-device-plugin/thunder-dra-operator
    # Bump on every `make image push`. `make version` prints the current tag.
    # A -dirty suffix means the build came from an uncommitted tree, so the
    # tag is not reproducible; Always keeps the kubelet from serving a stale
    # layer when the same tag is overwritten.
    tag: "f931f1b-dirty"
    pullPolicy: Always

daemon:
  image:
    repository: ghcr.io/thunder-compute/thunder-device-plugin/thunder-device-plugin-daemon
    tag: "f931f1b-dirty"
    pullPolicy: Always
