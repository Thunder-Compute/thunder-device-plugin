apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: {{ include "thunder-gpu-test-pod.fullname" . | quote }}
  labels:
    {{- include "thunder-gpu-test-pod.labels" . | nindent 4 }}
spec:
  metadata:
    labels:
      {{- include "thunder-gpu-test-pod.labels" . | nindent 6 }}
  spec:
    devices:
      requests:
        - name: {{ .Values.requestName | quote }}
          exactly:
            deviceClassName: {{ printf "%s%s" .Values.deviceClassPrefix (lower .Values.gpu.type) | quote }}
            allocationMode: ExactCount
            count: {{ .Values.gpu.count }}
