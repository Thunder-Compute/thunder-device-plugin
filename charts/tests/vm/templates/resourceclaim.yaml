apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: {{ include "thunder-gpu-test-vm.claimName" . | quote }}
  labels:
    {{- include "thunder-gpu-test-vm.labels" . | nindent 4 }}
spec:
  devices:
    requests:
      - name: {{ .Values.requestName | quote }}
        exactly:
          deviceClassName: {{ .Values.deviceClassName | quote }}
          selectors:
            - cel:
                expression: {{ printf "device.attributes[%q][\"gpu_type\"] == %q" .Values.driverName .Values.gpu.type | quote }}
          allocationMode: ExactCount
          count: {{ .Values.gpu.count }}
