# Override the chart name used for resource names, or the generated names
# themselves. Leave empty for the defaults.
nameOverride: ""
fullnameOverride: ""

# Pull secrets applied to both the daemon and the operator.
imagePullSecrets: []

namespace:
  create: true
  name: thunder-system

image:
  repository: thundercompute/thunder-device-plugin-daemon
  tag: latest
  pullPolicy: IfNotPresent

operator:
  enabled: true
  replicas: 1
  image:
    repository: thundercompute/thunder-dra-operator
    tag: latest
    pullPolicy: IfNotPresent
  driverName: thundercompute.com
  resourceSliceNamePrefix: thunder
  reconcileInterval: 60s
  validGPUCounts:
    - "1"
    # - "2"
    # - "4"
    # - "8"
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources: {}

thunder:
  # Prefer passing this with --set-file or an external secrets flow.
  apiToken: ""
  apiURL: "https://api.thundercompute.com:2096"
  # Set this to reuse a pre-created Secret in thunder-system.
  existingSecret: ""
  secretName: thunder-api
  apiTokenKey: THUNDER_API_TOKEN
  apiURLKey: THUNDER_API_URL

node:
  # The Kubernetes node name is injected from spec.nodeName.
  #
  # zone and advertisedIP are per-node overrides that apply to every node in the
  # DaemonSet, so leave them empty unless the whole cluster shares one value.
  # When empty the daemon resolves them per node:
  #   zone         -> the zoneLabel label (required)
  #   advertisedIP -> the advertisedIPLabel label, else the node's own IP
  #                   (status.addresses InternalIP, then ExternalIP)
  zone: ""
  advertisedIP: ""
  zoneLabel: topology.kubernetes.io/zone
  advertisedIPLabel: thundercompute.com/advertised-ip

nvidia:
  minDriverVersion: "610"
  libcudaPath: /usr/lib/x86_64-linux-gnu/libcuda.so.1
  libnvidiaMLPath: /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1
  nvidiaSMIPath: /usr/bin/nvidia-smi

hostRoot: /host
hostTargetPID: "1"

dra:
  enabled: true
  driverName: thundercompute.com
  thunderClientNamespace: thunder-system
  kubeletPluginDir: /var/lib/kubelet/plugins/thundercompute.com
  kubeletRegistrarDir: /var/lib/kubelet/plugins_registry

deviceClass:
  enabled: true
  name: thunder-gpu

cdi:
  specDir: /var/run/cdi

nodeSelector:
  thundercompute.com/node: "true"
  nvidia.com/gpu.present: "true"

nodeLabelKeys:
  # Label that marks a node as Thunder-eligible. The DaemonSet requires it in
  # addition to nodeSelector above.
  thunderNode: thundercompute.com/node

tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}

resources: {}

tests:
  # Resources created by `helm test`. The image only needs kubectl on PATH.
  enabled: true
  image:
    repository: registry.k8s.io/kubectl
    tag: v1.34.0
    pullPolicy: IfNotPresent
  timeoutSeconds: 120
