apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "thunder-device-plugin.fullname" . | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "thunder-device-plugin.labels" . | nindent 4 }}
    app.kubernetes.io/component: daemon
spec:
  selector:
    matchLabels:
      {{- include "thunder-device-plugin.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "thunder-device-plugin.selectorLabels" . | nindent 8 }}
        {{- with .Values.daemon.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.daemon.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "thunder-device-plugin.fullname" . | quote }}
      hostPID: true
      containers:
        - name: daemon
          image: "{{ .Values.daemon.image.repository }}:{{ .Values.daemon.image.tag }}"
          imagePullPolicy: {{ .Values.daemon.image.pullPolicy }}
          securityContext:
            privileged: true
            runAsUser: 0
          env:
            - name: NODE
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_ZONE_LABEL
              value: {{ .Values.node.zoneLabel | quote }}
            - name: NODE_ADVERTISED_IP_LABEL
              value: {{ .Values.node.advertisedIPLabel | quote }}
            - name: THUNDER_API_URL
              value: {{ .Values.thunder.apiURL | quote }}
            - name: MIN_DRIVER_VERSION
              value: {{ .Values.nvidia.minDriverVersion | quote }}
            - name: DRA_DRIVER_NAME
              value: {{ .Values.driverName | quote }}
            - name: THUNDER_CLIENT_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: KUBELET_PLUGIN_DIR
              value: {{ include "thunder-device-plugin.kubeletPluginDir" . | quote }}
            - name: KUBELET_REGISTRAR_DIR
              value: {{ .Values.kubelet.registrarDir | quote }}
            - name: CDI_SPEC_DIR
              value: {{ .Values.cdi.specDir | quote }}
            - name: LIBCUDA_PATH
              value: {{ .Values.nvidia.libcudaPath | quote }}
            - name: LIBNVIDIA_ML_PATH
              value: {{ .Values.nvidia.libnvidiaMLPath | quote }}
            - name: NVIDIA_SMI_PATH
              value: {{ .Values.nvidia.nvidiaSMIPath | quote }}
            - name: THUNDER_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.thunder.secretName | quote }}
                  key: THUNDER_API_TOKEN
          volumeMounts:
            - name: host-root
              mountPath: "/host"
              readOnly: true
              mountPropagation: HostToContainer
            - name: kubelet-plugin-dir
              mountPath: {{ include "thunder-device-plugin.kubeletPluginDir" . | quote }}
              mountPropagation: Bidirectional
            - name: kubelet-registrar-dir
              mountPath: {{ .Values.kubelet.registrarDir | quote }}
            - name: cdi-spec-dir
              mountPath: {{ .Values.cdi.specDir | quote }}
          {{- with .Values.daemon.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: kubelet-plugin-dir
          hostPath:
            path: {{ include "thunder-device-plugin.kubeletPluginDir" . | quote }}
            type: DirectoryOrCreate
        - name: kubelet-registrar-dir
          hostPath:
            path: {{ .Values.kubelet.registrarDir | quote }}
            type: Directory
        - name: cdi-spec-dir
          hostPath:
            path: {{ .Values.cdi.specDir | quote }}
            type: DirectoryOrCreate
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ .Values.node.zoneLabel | quote }}
                    operator: Exists
                  - key: {{ .Values.node.thunderLabel | quote }}
                    operator: In
                    values:
                      - "true"
        {{- with .Values.daemon.affinity }}
        {{- with .nodeAffinity }}
        {{- with .preferredDuringSchedulingIgnoredDuringExecution }}
          preferredDuringSchedulingIgnoredDuringExecution:
            {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- end }}
        {{- with .podAffinity }}
        podAffinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .podAntiAffinity }}
        podAntiAffinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- end }}
      {{- with .Values.daemon.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.daemon.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
