{{- if not .Values.thunder.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.thunder.secretName | quote }}
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    {{- include "thunder-device-plugin.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.thunder.apiTokenKey }}: {{ required "thunder.apiToken is required unless thunder.existingSecret is set" .Values.thunder.apiToken | quote }}
  {{ .Values.thunder.apiURLKey }}: {{ .Values.thunder.apiURL | quote }}
{{- end }}
