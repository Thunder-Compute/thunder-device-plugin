{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-test-inventory" (include "thunder-device-plugin.fullname" .) | trunc 63 | trimSuffix "-" | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "thunder-device-plugin.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  serviceAccountName: {{ include "thunder-device-plugin.fullname" . | quote }}
  restartPolicy: Never
  containers:
    - name: inventory
      image: "{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}"
      imagePullPolicy: {{ .Values.tests.image.pullPolicy }}
      command:
        - /bin/sh
        - -ec
        - |
          # The operator publishes one ResourceSlice per zone and GPU type.
          # Poll rather than check once: the first reconcile happens shortly
          # after the Deployment becomes ready.
          deadline=$(( $(date +%s) + {{ .Values.tests.timeoutSeconds }} ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            slices=$(kubectl get resourceslices \
              -l app.kubernetes.io/name=thunder-dra-driver \
              -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true)
            if [ -n "$slices" ]; then
              echo "thunder inventory published: $slices"
              exit 0
            fi
            sleep 5
          done
          echo "no ResourceSlices published by the thunder operator after {{ .Values.tests.timeoutSeconds }}s" >&2
          echo "check: kubectl -n {{ .Release.Namespace }} logs -l app.kubernetes.io/component=operator" >&2
          exit 1
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65532
        capabilities:
          drop: ["ALL"]
{{- end }}
