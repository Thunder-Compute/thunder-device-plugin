{{- if .Values.deviceClass.enabled }}
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: {{ .Values.deviceClass.name | quote }}
  labels:
    app.kubernetes.io/name: thunder-dra-driver
    app.kubernetes.io/component: device-class
spec:
  selectors:
    - cel:
        expression: |
          device.driver == {{ .Values.dra.driverName | quote }}
{{- end }}
