apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clients.thundercompute.com
spec:
  group: thundercompute.com
  scope: Namespaced
  names:
    plural: clients
    singular: client
    kind: ThunderClient
    shortNames:
      - tclient
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                claimUID:
                  type: string
                claimNamespace:
                  type: string
                claimName:
                  type: string
                gpuType:
                  type: string
                gpuCount:
                  type: integer
                  format: int64
            status:
              type: object
              properties:
                nodeName:
                  type: string
                zone:
                  type: string
                requestName:
                  type: string
                poolName:
                  type: string
                deviceName:
                  type: string
                shareID:
                  type: string
                cdiName:
                  type: string
                enrollmentTokenID:
                  type: string
                guestNamespace:
                  type: string
                guestConfigMapName:
                  type: string
                guestSecretName:
                  type: string
                createdAt:
                  type: string
                  format: date-time
                updatedAt:
                  type: string
                  format: date-time
                consumer:
                  type: object
                  properties:
                    apiGroup:
                      type: string
                    resource:
                      type: string
                    namespace:
                      type: string
                    name:
                      type: string
                    uid:
                      type: string
      additionalPrinterColumns:
        - name: GPU
          type: string
          jsonPath: .spec.gpuType
        - name: Count
          type: integer
          jsonPath: .spec.gpuCount
        - name: Node
          type: string
          jsonPath: .status.nodeName
        - name: ID
          type: string
          description: Thunder enrollment token ID for this client
          jsonPath: .status.enrollmentTokenID
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
