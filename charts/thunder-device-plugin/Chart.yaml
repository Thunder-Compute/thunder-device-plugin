apiVersion: v2
name: thunder-device-plugin
description: Attach Thunder Compute GPUs to Kubernetes pods and KubeVirt VMs through Dynamic Resource Allocation
type: application

# The chart version is authoritative for packaged Helm releases. The
# appVersion is the default image tag for source renders; release packaging
# overrides both from VERSION so releases select their promoted images.
version: 0.1.0
appVersion: "0.1.0"

kubeVersion: ">=1.34.0-0"

home: https://www.thundercompute.com
sources:
  - https://github.com/Thunder-Compute/thunder-device-plugin
icon: https://www.thundercompute.com/favicon.ico

keywords:
  - gpu
  - dra
  - dynamic-resource-allocation
  - device-plugin
  - kubevirt
  - nvidia
  - thunder

maintainers:
  - name: Thunder Compute
    email: support@thundercompute.com
    url: https://github.com/Thunder-Compute

annotations:
  artifacthub.io/category: ai-machine-learning
  artifacthub.io/prerelease: "true"
  artifacthub.io/operator: "true"
  artifacthub.io/crds: |
    - kind: ThunderClient
      version: v1alpha1
      name: clients.thundercompute.com
      displayName: Thunder Client
      description: Tracks the Thunder client enrollment backing one prepared ResourceClaim
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/Thunder-Compute/thunder-device-plugin#readme
    - name: Source
      url: https://github.com/Thunder-Compute/thunder-device-plugin
